<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>美顏相機</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main class="app">
    <div class="stage">
      <canvas id="view"></canvas>
      <video id="video" playsinline muted autoplay hidden></video>
      <div id="grid" class="gridlines" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <button id="gridbtn" class="gridbtn" title="九宮格輔助線">▦</button>
      <div id="status" class="status" hidden></div>
      <div id="msg" class="msg">點下方快門按鈕開啟相機</div>
      <div id="countdown" class="countdown" hidden></div>
    </div>

    <section class="panel">
      <div class="tabs">
        <button data-tab="skin" class="on">美膚</button>
        <button data-tab="face">五官</button>
        <button data-tab="makeup">彩妝</button>
        <button data-tab="quality">畫質</button>
        <button data-tab="filter">濾鏡</button>
      </div>

      <div class="tabpane on" id="tab-skin">
        <div class="sliders two">
          <label><span>磨皮</span><input type="range" id="smooth" min="0" max="100" value="55"></label>
          <label><span>美白</span><input type="range" id="white" min="0" max="100" value="30"></label>
          <label><span>紅潤</span><input type="range" id="warm" min="0" max="100" value="20"></label>
          <label><span>黑眼圈</span><input type="range" id="dark" min="0" max="100" value="0"></label>
        </div>
      </div>

      <div class="tabpane" id="tab-face">
        <div class="sliders two">
          <label><span>大眼</span><input type="range" id="eye" min="0" max="100" value="20"></label>
          <label><span>嘴型</span><input type="range" id="mouth" min="-100" max="100" value="0"></label>
          <label><span>亮眼</span><input type="range" id="bright" min="0" max="100" value="30"></label>
          <label><span>美牙</span><input type="range" id="teeth" min="0" max="100" value="40"></label>
        </div>
        <p class="hint">嘴型：右＝放大、左＝縮小</p>
      </div>

      <div class="tabpane" id="tab-makeup">
        <div class="sliders two">
          <label><span>唇色</span><input type="range" id="lip" min="0" max="100" value="20"></label>
          <label><span>腮紅</span><input type="range" id="blush" min="0" max="100" value="0"></label>
          <label><span>立體</span><input type="range" id="hi" min="0" max="100" value="0"></label>
        </div>
        <p class="hint">立體：在鼻樑、額頭與下巴尖加上自然高光</p>
      </div>

      <div class="tabpane" id="tab-quality">
        <div class="sliders two">
          <label><span>亮度</span><input type="range" id="bri" min="-100" max="100" value="0"></label>
          <label><span>對比</span><input type="range" id="con" min="-100" max="100" value="0"></label>
          <label><span>飽和</span><input type="range" id="sat" min="-100" max="100" value="0"></label>
          <label><span>清晰</span><input type="range" id="sharp" min="0" max="100" value="0"></label>
          <label><span>暗角</span><input type="range" id="vig" min="0" max="100" value="0"></label>
        </div>
      </div>

      <div class="tabpane" id="tab-filter">
        <div class="chiprow"><span class="rowlabel">模式</span><div class="filters" id="presets"></div></div>
        <div class="chiprow"><span class="rowlabel">濾鏡</span><div class="filters" id="filters"></div></div>
      </div>

      <div class="controls">
        <button id="flip" class="side" title="切換鏡頭">🔄</button>
        <button id="shutter" class="shutter" aria-label="拍照"></button>
        <button id="timer" class="side" title="倒數計時">⏱ 0</button>
      </div>
    </section>
  </main>

  <div id="preview" class="preview" hidden>
    <img id="photo" alt="拍攝結果">
    <div class="preview-actions">
      <button id="retake">重拍</button>
      <button id="share">分享</button>
      <a id="download" download="beauty.jpg">下載</a>
    </div>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
